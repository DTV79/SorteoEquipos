name: Ordenar jugadores por alias

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ordenar-jugadores-por-alias.yml'

permissions:
  contents: write

jobs:
  aplicar-cambio:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Aplicar orden por alias
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.jsx')
          text = path.read_text(encoding='utf-8')

          marker = "async function cargarCatalogoGeneral() {"
          helper = """function obtenerClaveOrdenJugador(jugador) {\n  const nombreCompleto = [\n    jugador?.nombre,\n    jugador?.apellidos,\n  ]\n    .filter(Boolean)\n    .join(' ')\n    .trim()\n\n  return String(\n    jugador?.alias ||\n    nombreCompleto ||\n    jugador?.codigo_jugador ||\n    ''\n  ).trim()\n}\n\nfunction compararJugadoresPorAlias(a, b) {\n  const porAlias = obtenerClaveOrdenJugador(a)\n    .localeCompare(\n      obtenerClaveOrdenJugador(b),\n      'es',\n      { sensitivity: 'base' }\n    )\n\n  if (porAlias !== 0) {\n    return porAlias\n  }\n\n  return String(a?.codigo_jugador || '')\n    .localeCompare(\n      String(b?.codigo_jugador || ''),\n      'es',\n      { numeric: true, sensitivity: 'base' }\n    )\n}\n\n\n"""

          if 'function compararJugadoresPorAlias' not in text:
            if marker not in text:
              raise SystemExit('No se encontró cargarCatalogoGeneral')
            text = text.replace(marker, helper + marker, 1)

          old_order = """    .eq('activo', true)\n    .order(\n      'nombre',\n      { ascending: true }\n    )"""
          new_order = """    .eq('activo', true)"""
          if old_order in text:
            text = text.replace(old_order, new_order, 1)

          old_set = """  setCatalogoJugadores(\n    data ?? []\n  )\n\n  return data ?? []"""
          new_set = """  const listaOrdenada =\n    [...(data ?? [])].sort(\n      compararJugadoresPorAlias\n    )\n\n  setCatalogoJugadores(\n    listaOrdenada\n  )\n\n  return listaOrdenada"""
          if old_set in text:
            text = text.replace(old_set, new_set, 1)
          elif 'const listaOrdenada =' not in text:
            raise SystemExit('No se encontró el bloque de carga del catálogo')

          old_edit = """        .sort((a, b) =>\n          String(a.nombre).localeCompare(String(b.nombre), 'es')\n        )"""
          new_edit = """        .sort(compararJugadoresPorAlias)"""
          if old_edit in text:
            text = text.replace(old_edit, new_edit, 1)
          elif '.sort(compararJugadoresPorAlias)' not in text:
            raise SystemExit('No se encontró el orden tras editar jugador')

          old_create = """      ].sort(\n        (a, b) =>\n          String(a.nombre).localeCompare(\n            String(b.nombre),\n            'es'\n          )\n      )"""
          new_create = """      ].sort(\n        compararJugadoresPorAlias\n      )"""
          if old_create in text:
            text = text.replace(old_create, new_create, 1)
          else:
            expected = """      ].sort(\n        compararJugadoresPorAlias\n      )"""
            if expected not in text:
              raise SystemExit('No se encontró el orden tras crear jugador')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Guardar cambio
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          if git diff --cached --quiet; then
            echo "No hay cambios pendientes"
            exit 0
          fi
          git commit -m "Ordena jugadores por alias"
          git push
