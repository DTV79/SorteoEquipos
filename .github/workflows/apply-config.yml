name: Apply config dependencies
on:
  push:
    branches: [fix/configuracion-dependencias-react]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Modificar CampeonatoConfiguracion.jsx
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/CampeonatoConfiguracion.jsx')
          s=p.read_text()
          def rep(old,new,label):
              global s
              if old not in s: raise SystemExit(f'No encontrado: {label}')
              s=s.replace(old,new,1)
          rep("    config.repetir_enfrentamientos_regrupos = false\n  } else if (config.tipo_campeonato === 'Grupos') {", "    config.repetir_enfrentamientos_regrupos = false\n    if (config.formato_acceso_eliminatorias === 'Campeones de ReGrupo directos a semifinales') {\n      config.formato_acceso_eliminatorias = 'Cruces normales'\n    }\n  } else if (config.tipo_campeonato === 'Grupos') {", 'normalización Liguilla')
          rep("          siguiente.repetir_enfrentamientos_regrupos = false\n        } else if (value === 'Grupos') {", "          siguiente.repetir_enfrentamientos_regrupos = false\n          if (actual.formato_acceso_eliminatorias === 'Campeones de ReGrupo directos a semifinales') {\n            siguiente.formato_acceso_eliminatorias = 'Cruces normales'\n          }\n        } else if (value === 'Grupos') {", 'cambio Liguilla')
          rep("      if (name === 'estructura_primera_fase') {\n        siguiente.num_grupos_iniciales = value === '4 Grupos' ? 4 : value === '2 Grupos' ? 2 : 1\n      }\n      return siguiente", "      if (name === 'estructura_primera_fase') {\n        siguiente.num_grupos_iniciales = value === '4 Grupos' ? 4 : value === '2 Grupos' ? 2 : 1\n      }\n      if (name === 'equipos_por_grupo' && nuevoValor !== '') {\n        const capacidad = Math.max(2, Number(nuevoValor))\n        siguiente.equipos_pasan_a_regrupos = Math.min(Number(actual.equipos_pasan_a_regrupos || capacidad), capacidad)\n        siguiente.equipos_pasan_a_cruces_por_grupo = Math.min(Number(actual.equipos_pasan_a_cruces_por_grupo || capacidad), capacidad)\n      }\n      if (name === 'equipos_pasan_a_regrupos' && nuevoValor !== '' && Number(nuevoValor) > Number(actual.equipos_por_grupo)) {\n        siguiente.equipos_pasan_a_regrupos = Number(actual.equipos_por_grupo)\n      }\n      if (name === 'equipos_pasan_a_cruces_por_grupo' && actual.tipo_campeonato === 'Grupos' && nuevoValor !== '' && Number(nuevoValor) > Number(actual.equipos_por_grupo)) {\n        siguiente.equipos_pasan_a_cruces_por_grupo = Number(actual.equipos_por_grupo)\n      }\n      if (name === 'hay_regrupos' && !checked) {\n        siguiente.repetir_enfrentamientos_regrupos = false\n        if (actual.formato_acceso_eliminatorias === 'Campeones de ReGrupo directos a semifinales') {\n          siguiente.formato_acceso_eliminatorias = 'Cruces normales'\n        }\n      }\n      if (name === 'repetir_enfrentamientos_regrupos' && checked) {\n        siguiente.puntos_partido_arrastrado = 0\n      }\n      if (name === 'puntos_objetivo_set' && nuevoValor !== '' && Number(actual.puntos_maximos_por_set) < Number(nuevoValor)) {\n        siguiente.puntos_maximos_por_set = Number(nuevoValor)\n      }\n      if (name === 'puntos_maximos_por_set' && nuevoValor !== '' && Number(nuevoValor) < Number(actual.puntos_objetivo_set)) {\n        siguiente.puntos_maximos_por_set = Number(actual.puntos_objetivo_set)\n      }\n      return siguiente", 'dependencias cambiar')
          rep('type="number" min="1" name="equipos_pasan_a_cruces_por_grupo"', 'type="number" min="1" max={esGrupos ? config.equipos_por_grupo || undefined : undefined} name="equipos_pasan_a_cruces_por_grupo"', 'máximo cruces')
          rep('type="number" min="2" name="equipos_pasan_a_regrupos"', 'type="number" min="2" max={config.equipos_por_grupo || undefined} name="equipos_pasan_a_regrupos"', 'máximo regrupos')
          rep('<Campo etiqueta="Puntos por victoria arrastrada"><input type="number" min="0" name="puntos_partido_arrastrado" value={config.puntos_partido_arrastrado} onChange={cambiar} /></Campo>', '<Campo etiqueta="Puntos por victoria arrastrada" ayuda={config.repetir_enfrentamientos_regrupos ? \'Al repetir todos los partidos, no se arrastran puntos.\' : \'Se aplica al enfrentamiento anterior que no se vuelve a jugar.\'}><input type="number" min="0" name="puntos_partido_arrastrado" value={config.repetir_enfrentamientos_regrupos ? 0 : config.puntos_partido_arrastrado} onChange={cambiar} disabled={config.repetir_enfrentamientos_regrupos} /></Campo>', 'arrastre')
          rep('<Campo etiqueta="Formato de acceso">', '<Campo etiqueta="Formato de acceso" ayuda={!config.hay_regrupos ? \'El acceso especial solo está disponible cuando hay ReGrupos.\' : \'Define cómo se enlazan ReGrupos y eliminatorias.\'}>', 'ayuda formato')
          rep('<option>Campeones de ReGrupo directos a semifinales</option>', '<option disabled={!config.hay_regrupos}>Campeones de ReGrupo directos a semifinales</option>', 'opción especial')
          p.write_text(s)
          PY
      - name: Verificar build
        run: npm ci && npm run build
      - name: Guardar componente verificado
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/CampeonatoConfiguracion.jsx
          git commit -m "Integra dependencias de Configuración en React"
          git push
