name: Ajustar baja catálogo jugadores

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ajustar-baja-catalogo-jugadores.yml'

permissions:
  contents: write

jobs:
  aplicar-cambio:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Ajustar mensajes de baja
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.jsx')
          text = path.read_text(encoding='utf-8')

          old = "'Jugador eliminado del catálogo.'"
          new = """data?.accion === 'inactivo'\n        ? 'El jugador tiene historial deportivo y se ha marcado como inactivo. Se conservan su histórico, fotos y caricaturas.'\n        : 'Jugador eliminado definitivamente del catálogo.'"""
          if old in text:
            text = text.replace(old, new, 1)
          elif "data?.accion === 'inactivo'" not in text:
            raise SystemExit('No se encontró el mensaje posterior a la baja')

          old = '¿Eliminar jugador del catálogo?'
          new = '¿Dar de baja al jugador?'
          if old in text:
            text = text.replace(old, new, 1)

          old = "Se eliminará la ficha global de{' '}"
          new = "Se aplicará la baja de{' '}"
          if old in text:
            text = text.replace(old, new, 1)

          old = 'Si el jugador todavía participa en algún sorteo, el sistema no permitirá borrarlo. Primero tendrás que eliminarlo de esos sorteos.'
          new = 'Si tiene historial deportivo, se conservará como inactivo y mantendrá sus partidos, estadísticas, ISP, fotos y caricaturas. Si no tiene historial deportivo, se eliminará definitivamente del catálogo.'
          if old in text:
            text = text.replace(old, new, 1)
          elif new not in text:
            raise SystemExit('No se encontró el aviso de eliminación')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Guardar cambio
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          if git diff --cached --quiet; then
            echo "No hay cambios pendientes"
            exit 0
          fi
          git commit -m "Aclara baja de jugadores con historial"
          git push
