name: Patch generar primera fase
on:
  push:
    branches: [feat/generar-primera-fase-ui]
    paths: [.github/workflows/patch-generar-primera-fase.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/generar-primera-fase-ui
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Aplicar cambios React
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/CampeonatoConfiguracion.jsx')
          s=p.read_text()
          old="  const [mostrarInfoClasificacion, setMostrarInfoClasificacion] = useState(false)\n"
          new=old+"  const [previsualizacionPrimeraFase, setPrevisualizacionPrimeraFase] = useState(null)\n  const [previsualizandoPrimeraFase, setPrevisualizandoPrimeraFase] = useState(false)\n  const [generandoPrimeraFase, setGenerandoPrimeraFase] = useState(false)\n  const [errorPrimeraFase, setErrorPrimeraFase] = useState('')\n"
          assert old in s
          s=s.replace(old,new,1)
          anchor="  async function abrirMantenimiento(tipo) {\n"
          funcs="""  async function previsualizarPrimeraFase() {
    setPrevisualizandoPrimeraFase(true)
    setErrorPrimeraFase('')
    setPrevisualizacionPrimeraFase(null)
    const { data, error } = await supabaseCampeonato.rpc(
      'admin_previsualizar_primera_fase',
      { p_codigo: codigo }
    )
    setPrevisualizandoPrimeraFase(false)
    if (error || data?.ok !== true) {
      setErrorPrimeraFase(error?.message || data?.error || 'No se pudo preparar la primera fase.')
      return
    }
    setPrevisualizacionPrimeraFase(data)
  }

  async function generarPrimeraFase() {
    setGenerandoPrimeraFase(true)
    setErrorPrimeraFase('')
    const { data, error } = await supabaseCampeonato.rpc(
      'admin_generar_primera_fase',
      { p_codigo: codigo }
    )
    setGenerandoPrimeraFase(false)
    if (error || data?.ok !== true) {
      setErrorPrimeraFase(error?.message || data?.error || 'No se pudo generar la primera fase.')
      return
    }
    setPrevisualizacionPrimeraFase(null)
    setMensaje({ tipo: 'correcto', texto: data?.mensaje || 'Primera fase generada correctamente.' })
  }

"""
          assert anchor in s
          s=s.replace(anchor,funcs+anchor,1)
          anchor2="          <fieldset className=\"zona-peligro-campeonato\">\n"
          ui="""          <fieldset className="generacion-primera-fase">
            <legend>Generación de la competición</legend>
            <p>La configuración decide automáticamente si se genera una Liguilla o la fase completa de Grupos. Primero se comprueba todo y no se crea ningún partido hasta que confirmes.</p>
            <div className="acciones-generacion-primera-fase">
              <button type="button" className="boton boton-secundario" onClick={previsualizarPrimeraFase} disabled={previsualizandoPrimeraFase || generandoPrimeraFase}>
                {previsualizandoPrimeraFase ? 'Comprobando…' : 'Previsualizar primera fase'}
              </button>
            </div>
            {errorPrimeraFase && <p className="error-generacion-primera-fase">{errorPrimeraFase}</p>}
            {previsualizacionPrimeraFase && (
              <div className="resumen-generacion-primera-fase">
                <strong>{previsualizacionPrimeraFase.tipo_campeonato || config.tipo_campeonato}</strong>
                {previsualizacionPrimeraFase.mensaje && <span>{previsualizacionPrimeraFase.mensaje}</span>}
                {previsualizacionPrimeraFase.total_equipos != null && <span>Equipos: {previsualizacionPrimeraFase.total_equipos}</span>}
                {previsualizacionPrimeraFase.num_grupos != null && <span>Grupos: {previsualizacionPrimeraFase.num_grupos}</span>}
                {previsualizacionPrimeraFase.partidos_previstos != null && <span>Partidos previstos: {previsualizacionPrimeraFase.partidos_previstos}</span>}
                {previsualizacionPrimeraFase.jornadas_previstas != null && <span>Jornadas previstas: {previsualizacionPrimeraFase.jornadas_previstas}</span>}
                {previsualizacionPrimeraFase.hay_descanso === true && <span>Habrá descanso por número impar de equipos.</span>}
                <button type="button" className="boton boton-principal" onClick={generarPrimeraFase} disabled={generandoPrimeraFase}>
                  {generandoPrimeraFase ? 'Generando…' : 'Confirmar y generar primera fase'}
                </button>
              </div>
            )}
          </fieldset>

"""
          assert anchor2 in s
          s=s.replace(anchor2,ui+anchor2,1)
          p.write_text(s)

          p=Path('src/CampeonatoConfiguracion.css')
          s=p.read_text()
          s += """
.generacion-primera-fase{border-color:#166534!important;background:#0b1712!important}.generacion-primera-fase legend{color:#86efac!important}.generacion-primera-fase>p{margin:0 0 14px;color:#cbd5e1;line-height:1.5}.acciones-generacion-primera-fase{display:flex;gap:10px;flex-wrap:wrap}.resumen-generacion-primera-fase{display:grid;gap:7px;margin-top:14px;padding:15px;border:1px solid #166534;border-radius:12px;background:#0d131a;color:#cbd5e1}.resumen-generacion-primera-fase strong{color:#86efac;font-size:16px}.resumen-generacion-primera-fase .boton{justify-self:start;margin-top:7px}.error-generacion-primera-fase{margin:14px 0 0!important;padding:11px 13px;border:1px solid #7f1d1d;border-radius:10px;background:#351418;color:#fca5a5!important;font-weight:800}@media(max-width:700px){.acciones-generacion-primera-fase .boton,.resumen-generacion-primera-fase .boton{width:100%;justify-self:stretch}}
"""
          p.write_text(s)
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/CampeonatoConfiguracion.jsx src/CampeonatoConfiguracion.css
          git commit -m "feat: generar primera fase desde configuración"
          git push
