name: Ordenar jugadores en inscripciones

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ordenar-jugadores-solicitudes.yml'

permissions:
  contents: write

jobs:
  aplicar-cambio:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Ordenar desplegables por alias
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/CampeonatoJugadores.jsx')
          text = path.read_text(encoding='utf-8')

          old = ".sort((a, b) => a.id_jugador.localeCompare(b.id_jugador))"
          new = ".sort((a, b) => String(a.alias ?? '').localeCompare(String(b.alias ?? ''), 'es', { sensitivity: 'base' }) || a.id_jugador.localeCompare(b.id_jugador))"
          if old not in text:
              raise SystemExit('No se encontró la ordenación por código del desplegable de solicitudes')
          text = text.replace(old, new, 1)

          old = "{disponibles.map((fila) => <option key={fila.id_jugador} value={fila.id_jugador}>{fila.alias} · {fila.nombre_oficial}</option>)}"
          new = "{[...disponibles].sort((a, b) => String(a.alias ?? '').localeCompare(String(b.alias ?? ''), 'es', { sensitivity: 'base' }) || a.id_jugador.localeCompare(b.id_jugador)).map((fila) => <option key={fila.id_jugador} value={fila.id_jugador}>{fila.alias} · {fila.nombre_oficial}</option>)}"
          if old not in text:
              raise SystemExit('No se encontró el desplegable de jugadores disponibles')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar compilación
        run: npm run build

      - name: Guardar cambio
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/CampeonatoJugadores.jsx
          if git diff --cached --quiet; then
            echo "No hay cambios pendientes"
            exit 0
          fi
          git commit -m "Ordena jugadores por alias en inscripciones"
          git push
