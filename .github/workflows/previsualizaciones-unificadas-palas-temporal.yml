name: Previsualizaciones unificadas y Palas
on:
  push:
    paths:
      - '.github/workflows/previsualizaciones-unificadas-palas-temporal.yml'
jobs:
  aplicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/previsualizaciones-unificadas-palas
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python .github/scripts/previsualizaciones_unificadas_palas.py
      - run: npm ci
      - run: npm run build
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/CampeonatoConfiguracion.jsx
          git diff --cached --quiet || git commit -m "Unifica previsualización y añade Palas de Playa"
          git push origin HEAD:feat/previsualizaciones-unificadas-palas
