name: Integrar ReGrupos temporal
on: [push]
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 .github/scripts/integrar_regrupos.py
      - run: npm ci
      - run: npm run build
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/CampeonatoConfiguracion.jsx src/CampeonatoConfiguracion.css
          git commit -m "feat: generar ReGrupos desde configuracion"
          git push
