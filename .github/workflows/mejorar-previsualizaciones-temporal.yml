name: Mejorar previsualizaciones
on:
  push:
    paths:
      - '.github/workflows/mejorar-previsualizaciones-temporal.yml'
jobs:
  aplicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python .github/scripts/mejorar_previsualizaciones.py
      - run: npm ci
      - run: npm run build
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/CampeonatoConfiguracion.jsx
          git diff --cached --quiet || git commit -m "Mejora la previsualización real de la primera fase"
          git push
