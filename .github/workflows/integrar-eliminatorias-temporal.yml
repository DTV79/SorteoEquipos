name: Integrar eliminatorias temporal
on:
  push:
    branches:
      - feat/previsualizacion-eliminatorias
jobs:
  integrar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python .github/scripts/integrar_eliminatorias.py
      - run: npm ci
      - run: npm run build
      - name: Guardar si cambió
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/CampeonatoConfiguracion.jsx
          git commit -m "Integra previsualización de eliminatorias"
          git push
